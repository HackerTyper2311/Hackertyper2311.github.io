<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Secure Mail</title>

<style>
:root{
    --bg:#0d1117;
    --card:#161b22;
    --accent:#238636;
    --text:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* APP CONTAINER */
.container{
    width:100%;
    height:100vh;
    max-width:520px;
    background:var(--card);
    display:flex;
    flex-direction:column;
    padding:20px;
}

/* SCREENS */
.screen{
    display:none;
    flex:1;
    flex-direction:column;
    justify-content:center;
}

.active{
    display:flex;
}

/* TITLE */
h1{
    text-align:center;
    font-size:22px;
    margin-bottom:20px;
}

/* INPUTS */
textarea,input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:active{
    transform:scale(0.98);
}

/* MESSAGE */
pre{
    background:var(--bg);
    padding:16px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:15px;
}

/* LOADING */
#loading{
    text-align:center;
    opacity:0.7;
}

/* ERROR */
#error{
    color:#ff6b6b;
    text-align:center;
    font-size:14px;
}

/* DESKTOP */
@media (min-width:700px){
    body{
        background:#000;
    }

    .container{
        height:90vh;
        border-radius:20px;
        box-shadow:0 0 40px rgba(0,0,0,.6);
    }
}
</style>
</head>

<body>

<div class="container">

<!-- SEND -->
<div id="sender" class="screen active">
    <h1>🔐 Secure Message</h1>

    <textarea id="message" rows="8" placeholder="Type secret message..."></textarea>

    <input type="password" id="password" placeholder="Password">

    <button onclick="sendMail()">Generate Email</button>
</div>

<!-- AUTH -->
<div id="auth" class="screen">
    <h1>🔑 Enter Password</h1>

    <input type="password" id="viewPassword" placeholder="Password">

    <button onclick="unlockMessage()">Unlock</button>

    <p id="error"></p>
</div>

<!-- VIEW -->
<div id="viewer" class="screen">
    <h1>📩 Message</h1>

    <div id="loading">⏳ Decrypting...</div>

    <pre id="output"></pre>

    <button onclick="goToSend()">📤 Send encrypted email</button>
</div>

</div>

<script>
const hash = location.hash.slice(1);

/* SCREEN CONTROL */
function show(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* INIT */
if(hash){
    show("auth");
}else{
    show("sender");
}

/* ---------- CRYPTO ---------- */

async function getKey(password, salt){
    const enc = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        {name:"PBKDF2"},
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt,
            iterations:100000,
            hash:"SHA-256"
        },
        keyMaterial,
        {name:"AES-GCM",length:256},
        false,
        ["encrypt","decrypt"]
    );
}

function bufToBase64(buf){
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

function base64ToBuf(base64){
    return Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
}

/* ENCRYPT */
async function encryptMessage(message,password){

    const enc = new TextEncoder();

    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));

    const key = await getKey(password,salt);

    const encrypted = await crypto.subtle.encrypt(
        {name:"AES-GCM",iv},
        key,
        enc.encode(message)
    );

    return JSON.stringify({
        salt:bufToBase64(salt),
        iv:bufToBase64(iv),
        data:bufToBase64(encrypted)
    });
}

/* DECRYPT */
async function decryptData(payload,password){

    const obj = JSON.parse(payload);

    const salt = base64ToBuf(obj.salt);
    const iv = base64ToBuf(obj.iv);
    const data = base64ToBuf(obj.data);

    const key = await getKey(password,salt);

    const decrypted = await crypto.subtle.decrypt(
        {name:"AES-GCM",iv},
        key,
        data
    );

    return new TextDecoder().decode(decrypted);
}

/* UNLOCK */
async function unlockMessage(){

    const password = document.getElementById("viewPassword").value;
    const payload = decodeURIComponent(hash);

    if(!password){
        document.getElementById("error").textContent="Enter password";
        return;
    }

    show("viewer");

    document.getElementById("loading").style.display="block";
    document.getElementById("output").textContent="";

    try{
        const text = await decryptData(payload,password);

        document.getElementById("loading").style.display="none";
        document.getElementById("output").textContent = text;

    }catch(e){
        document.getElementById("loading").style.display="none";
        show("auth");
        document.getElementById("error").textContent="❌ Wrong password";
    }
}

/* SEND */
async function sendMail(){

    const message = document.getElementById("message").value;
    const password = document.getElementById("password").value;

    if(!message || !password){
        alert("Fill everything");
        return;
    }

    const encrypted = await encryptMessage(message,password);

    const url =
        location.origin +
        location.pathname +
        "#" +
        encodeURIComponent(encrypted);

    const mail =
        "mailto:?subject=Encrypted Message&body=" +
        encodeURIComponent(url);

    window.location.href = mail;
}

/* BACK TO SEND */
function goToSend(){

    history.replaceState(null,"",location.pathname);

    document.getElementById("message").value="";
    document.getElementById("password").value="";
    document.getElementById("viewPassword").value="";
    document.getElementById("output").textContent="";
    document.getElementById("error").textContent="";

    show("sender");
}
</script>

</body>
</html>
