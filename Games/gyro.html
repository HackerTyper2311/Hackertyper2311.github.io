<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Maze Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #startBtn {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 25px; font-size: 18px;
      background: #0f62fe; border: none; border-radius: 10px; color: white;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<button id="startBtn">Start</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let ball = { x: 40, y: 40, r: 10, vx: 0, vy: 0 };
let tiltX = 0, tiltY = 0;

// ECHT DOOLHOF (grid)
const tile = 60;
const maze = [
  "1111111111",
  "1000000001",
  "1011111101",
  "1010000101",
  "1010110101",
  "1010100101",
  "1010111101",
  "1000000001",
  "1111111111"
];

function drawMaze() {
  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      if (maze[y][x] === "1") {
        ctx.fillStyle = "#555";
        ctx.fillRect(x * tile, y * tile, tile, tile);
      }
    }
  }
}

function isWall(x, y) {
  let gridX = Math.floor(x / tile);
  let gridY = Math.floor(y / tile);
  return maze[gridY] && maze[gridY][gridX] === "1";
}

function update() {
  ball.vx += tiltX * 0.3;
  ball.vy += tiltY * 0.3;

  ball.vx *= 0.95;
  ball.vy *= 0.95;

  let nextX = ball.x + ball.vx;
  let nextY = ball.y + ball.vy;

  // collision X
  if (!isWall(nextX + ball.r, ball.y) && !isWall(nextX - ball.r, ball.y)) {
    ball.x = nextX;
  } else {
    ball.vx = 0;
  }

  // collision Y
  if (!isWall(ball.x, nextY + ball.r) && !isWall(ball.x, nextY - ball.r)) {
    ball.y = nextY;
  } else {
    ball.vy = 0;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // borders met NOTCHES
  ctx.strokeStyle = "#888";
  ctx.lineWidth = 8;
  ctx.beginPath();

  for (let i = 0; i < canvas.width; i += 40) {
    ctx.moveTo(i, 0);
    ctx.lineTo(i + 20, 0);

    ctx.moveTo(i, canvas.height);
    ctx.lineTo(i + 20, canvas.height);
  }

  for (let i = 0; i < canvas.height; i += 40) {
    ctx.moveTo(0, i);
    ctx.lineTo(0, i + 20);

    ctx.moveTo(canvas.width, i);
    ctx.lineTo(canvas.width, i + 20);
  }

  ctx.stroke();

  drawMaze();

  // bal
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#0f0";
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function handleOrientation(event) {
  tiltX = event.gamma / 10;
  tiltY = event.beta / 10;
}

async function startGame() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    const permission = await DeviceOrientationEvent.requestPermission();
    if (permission === 'granted') {
      window.addEventListener("deviceorientation", handleOrientation);
      document.getElementById("startBtn").style.display = "none";
      loop();
    }
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    document.getElementById("startBtn").style.display = "none";
    loop();
  }
}

document.getElementById("startBtn").onclick = startGame;
</scri
