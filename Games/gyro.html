<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Target Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #startBtn {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 25px; font-size: 18px;
      background: #0f62fe; border: none; border-radius: 10px; color: white;
      z-index: 10;
    }
    #hud {
      position: absolute; top: 10px; left: 10px; color: white;
      font-size: 16px; z-index: 10;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<button id="startBtn">Start</button>
<div id="hud">Score: 0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let ball = { x: 100, y: 100, r: 12, vx: 0, vy: 0 };
let target = { x: 200, y: 200, r: 14 };
let tiltX = 0, tiltY = 0;
let score = 0;

function newTarget() {
  target.x = Math.random() * (canvas.width - 100) + 50;
  target.y = Math.random() * (canvas.height - 100) + 50;
}

function update() {
  ball.vx += tiltX * 0.4;
  ball.vy += tiltY * 0.4;

  ball.vx *= 0.95;
  ball.vy *= 0.95;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // keep in screen
  ball.x = Math.max(ball.r, Math.min(canvas.width - ball.r, ball.x));
  ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));

  // hit detection
  const dx = ball.x - target.x;
  const dy = ball.y - target.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < ball.r + target.r) {
    score++;
    document.getElementById("hud").innerText = "Score: " + score;
    newTarget();
  }
}

function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // target
  ctx.beginPath();
  ctx.arc(target.x, target.y, target.r, 0, Math.PI*2);
  ctx.fillStyle = "red";
  ctx.fill();

  // ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = "lime";
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function handleOrientation(event) {
  tiltX = event.gamma || 0;
  tiltY = event.beta || 0;
}

async function startGame() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== 'granted') {
        alert("Gyro permission denied");
        return;
      }
    }

    window.addEventListener("deviceorientation", handleOrientation);
    document.getElementById("startBtn").style.display = "none";

    newTarget();
    loop();

  } catch (e) {
    alert("Error: " + e);
  }
}

document.getElementById("startBtn").onclick = startGame;
</script>
</body>
</html>
