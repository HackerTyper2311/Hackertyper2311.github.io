<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Gyro Target Game</title>

<style>
:root {
  --glass: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.18);
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0b0b0f;
  height: 100%;
  font-family: system-ui, sans-serif;
}

/* Canvas */
canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

/* UI wrapper */
#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* LEFT HUD (landscape optimized) */
#hud {
  position: absolute;
  left: 12px;
  top: 12px;

  display: flex;
  flex-direction: column;
  gap: 10px;

  padding: 10px;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: white;
  backdrop-filter: blur(10px);
  font-size: 14px;
}

/* TIMER (vertical bar on right) */
#timerWrap {
  position: absolute;
  right: 12px;
  top: 12px;
  bottom: 12px;

  width: 10px;
  background: rgba(255,255,255,0.12);
  border-radius: 999px;
  overflow: hidden;
}

#timerBar {
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, #ff3b3b, #00ff88);
  transition: height 0.1s linear;
}

/* START OVERLAY */
#startOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: all;
  background: rgba(0,0,0,0.6);
}

button {
  padding: 14px 22px;
  font-size: 16px;
  border-radius: 14px;
  border: none;
  background: #0f62fe;
  color: white;
}

/* STOP BUTTON */
#stopBtn {
  position: absolute;
  bottom: 14px;
  right: 14px;
  pointer-events: all;
  display: none;
}

/* GAME OVER */
#gameOver {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: all;
  background: rgba(0,0,0,0.6);
}

.card {
  background: var(--glass);
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  color: white;
  backdrop-filter: blur(12px);
}

/* PORTRAIT WARNING */
#rotateWarning {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: black;
  color: white;
  font-size: 18px;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="time">10.0</div>
  </div>

  <div id="timerWrap">
    <div id="timerBar"></div>
  </div>

  <button id="stopBtn">Stop</button>

</div>

<div id="startOverlay">
  <button id="startBtn">Start Game</button>
</div>

<div id="gameOver">
  <div class="card">
    <h2>Game Over</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<div id="rotateWarning">
  Rotate your device to landscape mode 📱↻
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// state
let ball, target;
let score = 0;
let running = false;
let rafId = null;
let gameOver = false;

// timer
let timer = 10;
let lastHitTime = 0;

// gyro
let tiltX = 0, tiltY = 0;

// UI
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const timerBar = document.getElementById("timerBar");

// portrait check
function checkOrientation() {
  const warn = document.getElementById("rotateWarning");
  if (window.innerHeight > window.innerWidth) {
    warn.style.display = "flex";
  } else {
    warn.style.display = "none";
  }
}
window.addEventListener("resize", checkOrientation);
checkOrientation();

// init
function resetGame() {
  score = 0;
  timer = 10;
  gameOver = false;
  lastHitTime = Date.now();

  ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    r: 12,
    vx: 0,
    vy: 0
  };

  target = {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: 14
  };

  updateUI();
}

function newTarget() {
  target.x = Math.random() * (canvas.width - 80) + 40;
  target.y = Math.random() * (canvas.height - 80) + 40;
}

// UI
function updateUI() {
  scoreEl.textContent = `Score: ${score}`;
  timeEl.textContent = timer.toFixed(1);

  timerBar.style.height = (timer / 10 * 100) + "%";
}

// gyro
function handleOrientation(e) {
  tiltX = (e.gamma || 0) / 10;
  tiltY = (e.beta || 0) / 10;
}

// update
function update() {
  if (!running || gameOver) return;

  ball.vx += tiltX * 0.5;
  ball.vy += tiltY * 0.5;

  ball.vx *= 0.94;
  ball.vy *= 0.94;

  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.x = Math.max(ball.r, Math.min(canvas.width - ball.r, ball.x));
  ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));

  const dx = ball.x - target.x;
  const dy = ball.y - target.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < ball.r + target.r) {
    score++;
    lastHitTime = Date.now();
    newTarget();
    navigator.vibrate?.(20);
  }

  timer = Math.max(0, 10 - (Date.now() - lastHitTime) / 1000);

  if (timer <= 0) endGame();

  updateUI();
}

// draw
function draw() {
  ctx.fillStyle = "#0b0b0f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // target
  ctx.beginPath();
  ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
  ctx.fillStyle = "#ff4d4d";
  ctx.fill();

  // ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#00ff88";
  ctx.fill();
}

// loop
function loop() {
  if (!running) return;

  update();
  draw();

  rafId = requestAnimationFrame(loop);
}

// end
function endGame() {
  running = false;
  gameOver = true;

  document.getElementById("gameOver").style.display = "flex";
  document.getElementById("finalScore").textContent = `Score: ${score}`;

  document.getElementById("stopBtn").style.display = "none";
}

// gyro permission
async function enableGyro() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    const res = await DeviceOrientationEvent.requestPermission();
    if (res !== "granted") return false;
  }
  window.addEventListener("deviceorientation", handleOrientation);
  return true;
}

// start
async function startGame() {
  const ok = await enableGyro();
  if (!ok) return;

  await document.documentElement.requestFullscreen?.();

  document.getElementById("startOverlay").style.display = "none";
  document.getElementById("gameOver").style.display = "none";
  document.getElementById("stopBtn").style.display = "block";

  tiltX = 0;
  tiltY = 0;

  running = true;
  gameOver = false;

  resetGame();

  if (rafId) cancelAnimationFrame(rafId);
  loop();
}

// stop
function stopGame() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);

  document.getElementById("startOverlay").style.display = "flex";
  document.getElementById("stopBtn").style.display = "none";
}

// buttons
document.getElementById("startBtn").onclick = startGame;
document.getElementById("stopBtn").onclick = stopGame;
document.getElementById("restartBtn").onclick = startGame;
</script>

</body>
</html>
