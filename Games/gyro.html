<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Gyro Target Game Fixed</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0b0b0f;
  height: 100%;
  font-family: system-ui;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

/* UI */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  background: rgba(255,255,255,0.08);
  padding: 10px;
  border-radius: 12px;
  backdrop-filter: blur(10px);
  font-size: 14px;
}

#startBtn, #stopBtn {
  position: absolute;
  bottom: 12px;
  right: 12px;
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  color: white;
  background: #0f62fe;
  font-size: 14px;
}

#stopBtn {
  display: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">Score: 0 | Time: 10.0</div>

<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

// ================= STATE =================
let ball, target;
let score = 0;
let running = false;
let raf = null;

let timer = 10;
let lastHit = 0;

// ================= GYRO =================
// raw + smoothed values
let gx = 0, gy = 0;
let sx = 0, sy = 0;

const SMOOTH = 0.12;
const SENS = 0.35;

// ================= GYRO FIX =================
// Correct mapping for portrait + landscape
function handleOrientation(e) {
  const gamma = e.gamma || 0; // left/right
  const beta = e.beta || 0;   // front/back

  const isLandscape = innerWidth > innerHeight;

  if (isLandscape) {
    // 🔥 FIX: rotate axes in landscape mode
    gx = beta * SENS;
    gy = gamma * SENS;
  } else {
    // normal portrait mapping
    gx = gamma * SENS;
    gy = (beta - 45) * SENS; // neutral center correction
  }
}

// ================= GAME INIT =================
function reset() {
  score = 0;
  timer = 10;
  lastHit = Date.now();

  ball = {
    x: innerWidth / 2,
    y: innerHeight / 2,
    r: 12,
    vx: 0,
    vy: 0
  };

  target = {
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: 14
  };
}

// ================= UPDATE =================
function update() {
  if (!running) return;

  // smooth gyro (removes jitter)
  sx += (gx - sx) * SMOOTH;
  sy += (gy - sy) * SMOOTH;

  ball.vx += sx;
  ball.vy += sy;

  ball.vx *= 0.92;
  ball.vy *= 0.92;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // bounds
  ball.x = Math.max(ball.r, Math.min(innerWidth - ball.r, ball.x));
  ball.y = Math.max(ball.r, Math.min(innerHeight - ball.r, ball.y));

  // collision
  const dx = ball.x - target.x;
  const dy = ball.y - target.y;
  const dist = Math.hypot(dx, dy);

  if (dist < ball.r + target.r) {
    score++;
    lastHit = Date.now();
    target.x = Math.random() * innerWidth;
    target.y = Math.random() * innerHeight;
    navigator.vibrate?.(20);
  }

  // timer survival mechanic
  timer = Math.max(0, 10 - (Date.now() - lastHit) / 1000);

  if (timer <= 0) running = false;

  document.getElementById("hud").innerText =
    `Score: ${score} | Time: ${timer.toFixed(1)}`;
}

// ================= DRAW =================
function draw() {
  ctx.fillStyle = "#0b0b0f";
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  // target
  ctx.beginPath();
  ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
  ctx.fillStyle = "#ff4d4d";
  ctx.fill();

  // player
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#00ff88";
  ctx.fill();
}

// ================= LOOP =================
function loop() {
  if (!running) return;
  update();
  draw();
  raf = requestAnimationFrame(loop);
}

// ================= GYRO PERMISSION =================
async function enableGyro() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    const res = await DeviceOrientationEvent.requestPermission();
    if (res !== "granted") return false;
  }

  addEventListener("deviceorientation", handleOrientation);
  return true;
}

// ================= START =================
async function start() {
  const ok = await enableGyro();
  if (!ok) return;

  await document.documentElement.requestFullscreen?.();

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("stopBtn").style.display = "block";

  reset();
  running = true;

  cancelAnimationFrame(raf);
  loop();
}

// ================= STOP =================
function stop() {
  running = false;

  document.getElementById("startBtn").style.display = "block";
  document.getElementById("stopBtn").style.display = "none";

  cancelAnimationFrame(raf);
}

// ================= EVENTS =================
document.getElementById("startBtn").onclick = start;
document.getElementById("stopBtn").onclick = stop;
</script>

</body>
</html>
