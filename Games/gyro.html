<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Gyro Target Game</title>

<style>
:root {
  --glass: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.18);
  --text: #fff;
  --accent: #0f62fe;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0b0b0f;
  height: 100%;
  font-family: system-ui, sans-serif;
}

/* Canvas */
canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}

/* SAFE AREA WRAPPER */
#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* TOP HUD */
#hudBar {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  align-items: center;

  padding: 8px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  color: var(--text);
  backdrop-filter: blur(10px);
  font-size: 14px;
}

/* TIMER BAR */
#timerWrap {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  height: 6px;
  background: rgba(255,255,255,0.12);
  border-radius: 999px;
  overflow: hidden;
}

#timerBar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #00ff88, #ff3b3b);
  transition: width 0.1s linear;
}

/* START SCREEN */
#startOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: all;
}

#startBtn {
  padding: 16px 28px;
  font-size: 18px;
  background: var(--accent);
  border: none;
  border-radius: 14px;
  color: white;
  font-weight: 600;
}

/* BOTTOM CONTROL BAR */
#bottomBar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

  display: flex;
  justify-content: center;
  gap: 12px;

  padding: 14px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  pointer-events: all;
}

.btn {
  flex: 1;
  max-width: 180px;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: white;
  font-size: 16px;
  backdrop-filter: blur(10px);
}

#stopBtn {
  display: none;
}

/* GAME OVER */
#gameOver {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  pointer-events: all;
}

.card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  padding: 22px;
  border-radius: 18px;
  backdrop-filter: blur(12px);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <div id="hudBar">
    <span id="score">Score: 0</span>
    <span>•</span>
    <span id="time">10.0</span>
  </div>

  <div id="timerWrap">
    <div id="timerBar"></div>
  </div>

  <div id="bottomBar">
    <button class="btn" id="stopBtn">Stop</button>
  </div>

</div>

<div id="startOverlay">
  <button id="startBtn">Start Game</button>
</div>

<div id="gameOver">
  <div class="card">
    <h2>Game Over</h2>
    <p id="finalScore">Score: 0</p>
    <button class="btn" id="restartBtn">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Game state
let ball, target;
let score = 0;
let running = false;
let rafId = null;
let gameOver = false;

// Timer
let timer = 10;
let lastHitTime = 0;

// Gyro
let tiltX = 0, tiltY = 0;

// UI
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const timerBar = document.getElementById("timerBar");

// Init
function resetGame() {
  score = 0;
  timer = 10;
  gameOver = false;
  lastHitTime = Date.now();

  ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    r: 12,
    vx: 0,
    vy: 0
  };

  target = {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: 14
  };

  updateUI();
}

function newTarget() {
  target.x = Math.random() * (canvas.width - 100) + 50;
  target.y = Math.random() * (canvas.height - 100) + 50;
}

// UI update
function updateUI() {
  scoreEl.textContent = `Score: ${score}`;
  timeEl.textContent = timer.toFixed(1);

  const pct = (timer / 10) * 100;
  timerBar.style.width = pct + "%";
}

// Gyro
function handleOrientation(event) {
  tiltX = (event.gamma || 0) / 10;
  tiltY = (event.beta || 0) / 10;
}

// Update
function update() {
  if (!running || gameOver) return;

  ball.vx += tiltX * 0.5;
  ball.vy += tiltY * 0.5;

  ball.vx *= 0.94;
  ball.vy *= 0.94;

  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.x = Math.max(ball.r, Math.min(canvas.width - ball.r, ball.x));
  ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));

  const dx = ball.x - target.x;
  const dy = ball.y - target.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < ball.r + target.r) {
    score++;
    lastHitTime = Date.now();
    newTarget();
    if (navigator.vibrate) navigator.vibrate(25);
  }

  const elapsed = (Date.now() - lastHitTime) / 1000;
  timer = Math.max(0, 10 - elapsed);

  if (timer <= 0) {
    endGame();
  }

  updateUI();
}

// Draw
function draw() {
  ctx.fillStyle = "#0b0b0f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // target
  ctx.beginPath();
  ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
  ctx.fillStyle = "#ff4d4d";
  ctx.fill();

  // player
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#00ff88";
  ctx.fill();
}

// Loop
function loop() {
  if (!running) return;

  update();
  draw();

  rafId = requestAnimationFrame(loop);
}

// Game end
function endGame() {
  running = false;
  gameOver = true;

  document.getElementById("gameOver").style.display = "flex";
  document.getElementById("finalScore").textContent = `Score: ${score}`;

  document.getElementById("stopBtn").style.display = "none";
}

// Gyro permission
async function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    const res = await DeviceOrientationEvent.requestPermission();
    if (res !== "granted") return false;
  }

  window.addEventListener("deviceorientation", handleOrientation);
  return true;
}

// Start
async function startGame() {
  const ok = await enableGyro();
  if (!ok) return;

  await document.documentElement.requestFullscreen?.();

  document.getElementById("startOverlay").style.display = "none";
  document.getElementById("stopBtn").style.display = "block";
  document.getElementById("gameOver").style.display = "none";

  tiltX = 0;
  tiltY = 0;

  running = true;
  gameOver = false;

  resetGame();

  if (rafId) cancelAnimationFrame(rafId);
  loop();
}

// Stop
function stopGame() {
  running = false;

  if (rafId) cancelAnimationFrame(rafId);

  document.getElementById("startOverlay").style.display = "flex";
  document.getElementById("stopBtn").style.display = "none";
}

// Buttons
document.getElementById("startBtn").onclick = startGame;
document.getElementById("stopBtn").onclick = stopGame;
document.getElementById("restartBtn").onclick = startGame;
</script>

</body>
</html>
