<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Target Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
    #startBtn {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 25px; font-size: 18px;
      background: #0f62fe; border: none; border-radius: 10px; color: white;
    }
    #hud {
      position: absolute; top: 10px; left: 10px; font-size: 16px;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<button id="startBtn">Start</button>
<div id="hud">Score: 0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let ball = { x: canvas.width/2, y: canvas.height/2, r: 12, vx: 0, vy: 0 };
let target = { x: 100, y: 100, r: 14 };
let tiltX = 0, tiltY = 0;
let score = 0;

function newTarget() {
  target.x = Math.random() * (canvas.width - 100) + 50;
  target.y = Math.random() * (canvas.height - 100) + 50;
}

function update() {
  ball.vx += tiltX * 0.3;
  ball.vy += tiltY * 0.3;

  ball.vx *= 0.96;
  ball.vy *= 0.96;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // screen bounds
  if (ball.x < ball.r) ball.x = ball.r;
  if (ball.y < ball.r) ball.y = ball.r;
  if (ball.x > canvas.width - ball.r) ball.x = canvas.width - ball.r;
  if (ball.y > canvas.height - ball.r) ball.y = canvas.height - ball.r;

  // check hit target
  let dx = ball.x - target.x;
  let dy = ball.y - target.y;
  let dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < ball.r + target.r) {
    score++;
    document.getElementById("hud").innerText = "Score: " + score;
    newTarget();
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // target
  ctx.beginPath();
  ctx.arc(target.x, target.y, target.r, 0, Math.PI*2);
  ctx.fillStyle = "#f00";
  ctx.fill();

  // ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = "#0f0";
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function handleOrientation(event) {
  tiltX = event.gamma / 10;
  tiltY = event.beta / 10;
}

async function startGame() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    const permission = await DeviceOrientationEvent.requestPermission();
    if (permission === 'granted') {
      window.addEventListener("deviceorientation", handleOrientation);
      document.getElementById("startBtn").style.display = "none";
      newTarget();
      loop();
    }
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    document.getElementById("startBtn").style.display = "none";
    newTarget();
    loop();
  }
}

document.getElementById("startBtn").onclick = startGame;
</script>
</body>
</html>
