<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gyro Target Game</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      overflow: hidden;
      background: #111;
      height: 100%;
    }
    #startBtn {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 25px; font-size: 18px;
      background: #0f62fe; border: none; border-radius: 10px; color: white;
      z-index: 10;
    }
    #stopBtn {
      position: absolute;
      top: 10px; right: 10px;
      padding: 10px 15px; font-size: 14px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px; color: white;
      backdrop-filter: blur(5px);
      z-index: 10; display: none;
    }
    #hud {
      position: absolute;
      top: 10px; left: 10px;
      color: white; font-size: 16px;
      z-index: 10;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>
<div id="hud">Score: 0 | Time: 10.0</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let ball = { x: 100, y: 100, r: 12, vx: 0, vy: 0 };
let target = { x: 200, y: 200, r: 14 };
let tiltX = 0, tiltY = 0;
let score = 0;
let running = false;
let rafId = null; // track animation frame to prevent duplicate loops

let timer = 10;
let lastHitTime = 0;
let gameOver = false;

function newTarget() {
  target.x = Math.random() * (canvas.width - 100) + 50;
  target.y = Math.random() * (canvas.height - 100) + 50;
}

function resetGame() {
  score = 0;
  timer = 10;
  gameOver = false;
  lastHitTime = Date.now();

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;
  ball.vx = ball.vy = 0;

  document.getElementById("hud").innerText = "Score: 0 | Time: 10.0";
  newTarget();
}

function update() {
  if (!running || gameOver) return;

  ball.vx += tiltX * 0.5;
  ball.vy += tiltY * 0.5;
  ball.vx *= 0.94;
  ball.vy *= 0.94;
  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.x = Math.max(ball.r, Math.min(canvas.width - ball.r, ball.x));
  ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));

  const dx = ball.x - target.x;
  const dy = ball.y - target.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < ball.r + target.r) {
    score++;
    lastHitTime = Date.now();
    if (navigator.vibrate) navigator.vibrate(30);
    newTarget();
  }

  // Timer counts down from last hit (or game start)
  const elapsed = (Date.now() - lastHitTime) / 1000;
  timer = Math.max(0, 10 - elapsed);

  document.getElementById("hud").innerText =
    "Score: " + score + " | Time: " + timer.toFixed(1);

  if (timer <= 0) {
    gameOver = true;
  }
}

function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (gameOver) {
    // Game over screen
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 48px sans-serif";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = "32px sans-serif";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 10);
    ctx.font = "20px sans-serif";
    ctx.fillStyle = "#aaa";
    ctx.fillText("Press Start to play again", canvas.width / 2, canvas.height / 2 + 55);
    ctx.textAlign = "left";

    // Show start button, hide stop
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("stopBtn").style.display = "none";
    running = false;
    return;
  }

  // Draw target
  const gradient = ctx.createRadialGradient(target.x, target.y, 2, target.x, target.y, target.r);
  gradient.addColorStop(0, "#ff6666");
  gradient.addColorStop(1, "#660000");
  ctx.beginPath();
  ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // Draw ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "lime";
  ctx.fill();
}

function loop() {
  update();
  draw();
  if (running || gameOver) {
    rafId = requestAnimationFrame(loop);
  }
}

function handleOrientation(event) {
  tiltX = (event.gamma || 0) / 10;
  tiltY = (event.beta || 0) / 10;
}

async function startGame() {
  try {
    const el = document.documentElement;
    if (el.requestFullscreen) await el.requestFullscreen();

    window.addEventListener("deviceorientation", handleOrientation);

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";

    // Cancel any existing loop before starting a new one
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    running = true;
    resetGame();
    loop();

  } catch (e) {
    alert("Error: " + e);
  }
}

function stopGame() {
  running = false;
  gameOver = false;
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
  document.getElementById("startBtn").style.display = "block";
  document.getElementById("stopBtn").style.display = "none";
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("stopBtn").onclick = stopGame;
</script>
</body>
</html>
