<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft UI Simulator v4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{background:#111;color:white;font-family:sans-serif;text-align:center}
#controls{margin:10px}
button{margin:5px;padding:8px 16px;background:#222;color:white;border:1px solid #555;cursor:pointer}
.screen{display:none;border:2px solid #444;margin:10px;padding:10px;position:relative}
.active{display:block}
.ui-element{position:absolute}
</style>
</head>
<body>
<h1>🧱 Minecraft UI Simulator v4</h1>

<input type="file" id="baseInput" accept=".zip">
<p>Base pack</p>

<input type="file" id="overlayInput" accept=".mcpack,.zip">
<p>Overlay pack</p>

<div id="controls">
<button onclick="loadUIScreen('main_menu')">Main Menu</button>
<button onclick="loadUIScreen('inventory_screen')">Inventory</button>
<button onclick="loadUIScreen('hud_screen')">HUD</button>
</div>

<div id="uiRoot" class="screen active"></div>

<script>
let basePack={}, overlayPack={}, uiFiles={};

async function loadPack(file){
 const zip=await JSZip.loadAsync(file);
 let pack={};

 await Promise.all(Object.keys(zip.files).map(async(path)=>{
  const lower=path.toLowerCase();

  if(lower.endsWith('.png')){
   const blob=await zip.files[path].async('blob');
   pack[lower]=URL.createObjectURL(blob);
  }

  if(lower.includes('ui/') && lower.endsWith('.json')){
   const text=await zip.files[path].async('text');
   uiFiles[lower]=JSON.parse(text);
  }
 }));

 return pack;
}

function getTexture(path){
 path=path.toLowerCase();
 return overlayPack[path] || basePack[path] || null;
}

function loadUIScreen(name){
 const root=document.getElementById('uiRoot');
 root.innerHTML='';

 const fileKey=Object.keys(uiFiles).find(k=>k.includes(name));
 if(!fileKey){
  root.innerHTML='UI JSON not found';
  return;
 }

 const json=uiFiles[fileKey];
 renderJSON(json, root);
}

function renderJSON(obj, parent){
 for(const key in obj){
  const el=obj[key];

  const div=document.createElement('div');
  div.className='ui-element';

  if(el.texture){
   const img=document.createElement('img');
   img.src=getTexture(el.texture) || '';
   img.style.width='100px';
   div.appendChild(img);
  }

  if(el.text){
   div.textContent=el.text;
  }

  if(el.position){
   div.style.left=(el.position[0]||0)+'px';
   div.style.top=(el.position[1]||0)+'px';
  }

  if(el.size){
   div.style.width=el.size[0]+'px';
   div.style.height=el.size[1]+'px';
  }

  if(el.type==='button'){
   div.style.border='1px solid white';
   div.style.cursor='pointer';
   div.onclick=()=>alert('Clicked '+key);
  }

  parent.appendChild(div);

  if(typeof el==='object'){
   renderJSON(el, div);
  }
 }
}

document.getElementById('baseInput').addEventListener('change',async(e)=>{
 basePack=await loadPack(e.target.files[0]);
});

document.getElementById('overlayInput').addEventListener('change',async(e)=>{
 overlayPack=await loadPack(e.target.files[0]);
});
</script>
</body>
</html>
