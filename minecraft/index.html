<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft UI Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{background:#111;color:white;font-family:sans-serif;text-align:center}
#menu{margin-top:20px}
#viewer{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:10px;padding:20px}
img{width:100%;image-rendering:pixelated}
.screen{border:2px solid #444;padding:10px;margin:10px}
button{display:block;margin:5px auto;padding:8px 16px;background:#222;color:white;border:1px solid #555;cursor:pointer}
</style>
</head>
<body>
<h1>🧱 Minecraft UI + Texture Viewer</h1>
<input type="file" id="fileInput" accept=".mcpack,.zip">

<div id="menu" class="screen">
<h2>Main Menu Preview (non-playable)</h2>
<div id="mainMenu"></div>
</div>

<div id="viewer"></div>

<script>
const fileInput=document.getElementById('fileInput');
fileInput.addEventListener('change',async(e)=>{
const file=e.target.files[0];
const zip=await JSZip.loadAsync(file);
const viewer=document.getElementById('viewer');
const menu=document.getElementById('mainMenu');
viewer.innerHTML="";
menu.innerHTML="Loading UI...";

let textures={};

await Promise.all(Object.keys(zip.files).map(async(path)=>{
if(path.endsWith('.png')){
const blob=await zip.files[path].async('blob');
textures[path]=URL.createObjectURL(blob);
}
}));

// texture grid
for(let path in textures){
const div=document.createElement('div');
const img=document.createElement('img');
img.src=textures[path];
const label=document.createElement('div');
label.textContent=path;
div.appendChild(img);
div.appendChild(label);
viewer.appendChild(div);
}

// main menu mock
menu.innerHTML="";
const container=document.createElement('div');
container.style.width='320px';
container.style.margin='auto';
container.style.border='2px solid #666';
container.style.padding='10px';

const title=document.createElement('h3');
title.textContent='Minecraft';
container.appendChild(title);

['Play','Settings','Marketplace'].forEach(txt=>{
const btn=document.createElement('button');
btn.textContent=txt;
container.appendChild(btn);
});

menu.appendChild(container);
});
</script>
</body>
</html>
