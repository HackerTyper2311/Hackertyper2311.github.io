<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>YouTube Live Embed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

body{
    min-height:100dvh;
}


/* Main layout */
.container{
    display:flex;
    width:100%;
    height:100dvh;
}


/* Video */
.video{
    flex:3;
    min-width:0;
    min-height:0;
    background:#000;
}

.video iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}


/* Chat */
.chat{
    flex:1;
    min-width:320px;
    min-height:0;
    padding:8px;
    background:#111;
}

.chat iframe{
    width:100%;
    height:100%;
    border:0;
    border-radius:12px;
    display:block;
}


/* Portrait phones */
@media (orientation:portrait){

    .container{
        flex-direction:column;
    }

    .video{
        flex:none;
        width:100%;
        height:30dvh;
        max-height:280px;
    }

    .chat{
        flex:1;
        width:100%;
        min-width:0;
        padding:6px;
    }

}


/* Small portrait screens */
@media (orientation:portrait) and (max-width:400px){

    .video{
        height:25dvh;
        max-height:220px;
    }

}


/* Landscape phones */
@media (orientation:landscape) and (max-height:600px){

    .container{
        flex-direction:row;
    }

    .video{
        height:100%;
    }

}


/* Android safe area */
@supports(padding:env(safe-area-inset-bottom)){

    body{
        padding-bottom:env(safe-area-inset-bottom);
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="video">
        <iframe
            src="https://www.youtube.com/embed/gGCB8hOfaBw?autoplay=1"
            title="YouTube Live"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>


    <div class="chat">
        <iframe
            src="https://www.youtube.com/live_chat?v=gGCB8hOfaBw&embed_domain=hackertyper2311.github.io"
            title="YouTube Live Chat">
        </iframe>
    </div>

</div>

</body>
</html>
