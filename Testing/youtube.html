<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>YouTube Live Embed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
}


/* Dynamic container */
.container{
    flex:1;
    min-height:0;
    display:flex;
    width:100%;
}


/* Video */
.video{
    flex:3;
    min-width:0;
    min-height:0;
    background:#000;
}

.video iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}


/* Chat */
.chat{
    flex:1;
    min-width:320px;
    min-height:0;
    padding:8px;
    background:#111;
}

.chat iframe{
    width:100%;
    height:100%;
    border:0;
    border-radius:12px;
    display:block;
}


/* Mobile layout */
@media(max-width:768px){

    .container{
        flex-direction:column;
    }

    .video{
        flex:none;
        width:100%;
        aspect-ratio:16/9;
    }

    .video iframe{
        height:100%;
    }

    .chat{
        flex:1;
        min-width:0;
        padding:6px;
    }

}


/* Android navigation bar support */
@supports(padding:env(safe-area-inset-bottom)){

    body{
        padding-bottom:env(safe-area-inset-bottom);
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="video">
        <iframe
            src="https://www.youtube.com/embed/gGCB8hOfaBw?autoplay=1"
            title="YouTube Live Video"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>


    <div class="chat">
        <iframe
            src="https://www.youtube.com/live_chat?v=gGCB8hOfaBw&embed_domain=hackertyper2311.github.io"
            title="YouTube Live Chat">
        </iframe>
    </div>

</div>

</body>
</html>
