<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Games</title>
<style>
body {
  margin:0;
  font-family: system-ui, sans-serif;
  background:#0b0b0f;
  color:white;
}

.container {
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:20px;
}

h1 {
  margin:10px 0 20px 0;
  font-size:28px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card {
  background: rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  padding:20px;
  border-radius:16px;
  text-decoration:none;
  color:white;
  transition: transform 0.2s, background 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  background: rgba(255,255,255,0.15);
}

.card h2 {
  margin:0 0 8px 0;
  font-size:20px;
}

.card p {
  margin:0;
  opacity:0.8;
  font-size:14px;
}

@media (min-width: 768px) {
  h1 {
    font-size:34px;
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>🎮 My Games</h1>

  <div class="grid">
    <a class="card" href="./gyro-ball/">
      <h2>Gyro Ball</h2>
      <p>Tilt your phone to hit targets</p>
    </a>
  </div>
</div>

</body>
</html>
