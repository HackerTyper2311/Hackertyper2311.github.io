<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubNub Live Chat (!gamble Command)</title>
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.4.3.min.js"></script>
  <style>
    :root {
      --bg: transparent;
      --shadow-color: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    #list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    #list::-webkit-scrollbar {
      display: none;
    }

    .card {
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 4px 12px var(--shadow-color);
      flex-shrink: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .user {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .time {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .msg {
      font-size: 0.9rem;
      line-height: 1.35;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div id="list"></div>

  <script>
    const CONFIG = {
      channel: "quickfix",
      pubKey: "demo",
      subKey: "demo"
    };

    // Pool of random styles triggered by !gamble
    const randomStyles = [
      { bg: "rgba(15, 23, 42, 0.9)", border: "1px solid rgba(56, 189, 248, 0.4)", text: "#f8fafc", user: "#38bdf8", time: "#94a3b8" },
      { bg: "rgba(20, 10, 30, 0.9)", border: "1px solid rgba(236, 72, 153, 0.5)", text: "#fbcfe8", user: "#ec4899", time: "#f472b6" },
      { bg: "rgba(6, 78, 59, 0.9)", border: "1px solid rgba(52, 211, 153, 0.5)", text: "#ecfdf5", user: "#34d399", time: "#a7f3d0" },
      { bg: "rgba(124, 45, 18, 0.9)", border: "1px solid rgba(251, 146, 60, 0.5)", text: "#fff7ed", user: "#fb923c", time: "#fed7aa" },
      { bg: "rgba(76, 29, 149, 0.9)", border: "1px solid rgba(196, 181, 253, 0.5)", text: "#f5f3ff", user: "#c4b5fd", time: "#ddd6fe" }
    ];

    // Standard default style for normal messages
    const defaultStyle = {
      bg: "rgba(255, 255, 255, 0.95)",
      border: "1px solid rgba(226, 232, 240, 0.9)",
      text: "#0f172a",
      user: "#2563eb",
      time: "#64748b"
    };

    const list = document.getElementById("list");

    if (!window.pubnubInitialized) {
      window.pubnubInitialized = true;

      const pubnub = new PubNub({
        publishKey: CONFIG.pubKey,
        subscribeKey: CONFIG.subKey,
        userId: "embed-gamble-" + Math.random().toString(36).substring(2, 7)
      });

      pubnub.addListener({
        message: (e) => {
          const d = e.message || {};
          const user = d.user || "@anonymous";
          let text = d.message || JSON.stringify(d);
          const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

          let styleToUse = defaultStyle;

          // Check if message starts with "!gamble"
          if (text.trim().toLowerCase().startsWith("!gamble")) {
            styleToUse = randomStyles[Math.floor(Math.random() * randomStyles.length)];
            
            // Hide/strip the "!gamble" command word from the displayed message text
            text = text.replace(/^!gamble\s*/i, "");
            if (!text.trim()) {
              text = "🎲 [Gambled Style]";
            }
          }

          const card = document.createElement("div");
          card.className = "card";
          card.style.background = styleToUse.bg;
          card.style.border = styleToUse.border;

          card.innerHTML = `
            <div class="header">
              <span class="user" style="color: ${styleToUse.user};">${escape(user)}</span>
              <span class="time" style="color: ${styleToUse.time};">${time}</span>
            </div>
            <div class="msg" style="color: ${styleToUse.text};">${escape(text)}</div>
          `;

          list.appendChild(card);
          list.scrollTop = list.scrollHeight;
        }
      });

      pubnub.subscribe({ channels: [CONFIG.channel] });
    }

    function escape(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
